policy_id: bk21
policy_type: distributive
doc_path: data/policies/bk21/doc.md
graph_path: data/policies/bk21/graph.json
run_source: single

phases: [Inputs, Activities, Outputs, Outcomes, Impact]
eval_terminal_phase: Outcomes
post_target_phases: [Impact]

# X1 ground truth: provided directly by the user (Policy A/B comparison
# table, reporting period 2022). Note the document's own 2022 PLAN TARGET
# for employment rate (붙임3 "2022년도 예산 성과지표 및 목표") was 75.4% -- the
# user-supplied actual realized rate (82.2%) exceeded that plan target,
# which is worth surfacing in the report as a standalone finding
# independent of agent-prediction accuracy.
#
# TARGET VARIABLE CORRECTED (2026-08-10, user-confirmed by manual scenario
# inspection): the *officially-named* simulation-target variables
# (graduate_employment_rate_of_bk21_participants_in_2022,
# international_research_collaboration_rate_of_bk21_participants_in_2022)
# are NOT percentages despite the name -- empirically they are headcounts
# (observed range 30-17,100 / 8-19,000, median 750 / 605; a 0-100% variable
# would never look like this). The sibling variables `employment_rate`
# (observed 72-90, median 84.2) and `international_collaboration_rate`
# (observed 10-85, median 30) ARE well-behaved percentages sitting right next
# to the GT (82.2 / 36.0). So the GT comparison targets the sibling
# variables, not the officially-named ones. The officially-named/headcount
# variables are kept as `predicted` and reported descriptively (DX1 support
# width) but are not scored against a % ground truth -- there is no reliable
# headcount denominator to construct an equivalent GT for them.
targets:
  - name: employment_rate
    phase: Outcomes
    true_value: 82.2
    source: "User-supplied Policy A/B ground-truth table: 'Trainee employment rate (%)', reporting period 2022 (cf. document's own 2022 plan target of 75.4%, 붙임3). Compared against `employment_rate`, NOT the officially-named `graduate_employment_rate_of_bk21_participants_in_2022` -- see note above."
  - name: international_collaboration_rate
    phase: Outcomes
    true_value: 36.0
    source: "User-supplied Policy A/B ground-truth table: 'International collaboration rate (%)', reporting period 2022. Compared against `international_collaboration_rate`, NOT the officially-named `international_research_collaboration_rate_of_bk21_participants_in_2022` -- see note above."

# NOT true concept duplicates (revised understanding) -- confirmed unit
# mismatch, not two names for the same rate. Kept in this structure only
# because X3's internal-agreement diagnostic is still a useful way to
# quantify/track the mismatch; ground_truth_from now points at the variable
# that is actually a percentage.
concept_duplicates:
  - group: employment_rate_2022
    members: ["Outcomes.employment_rate", "Outcomes.graduate_employment_rate_of_bk21_participants_in_2022"]
    ground_truth_from: "Outcomes.employment_rate"
  - group: international_collaboration_rate_2022
    members: ["Outcomes.international_collaboration_rate",
              "Outcomes.international_research_collaboration_rate_of_bk21_participants_in_2022"]
    ground_truth_from: "Outcomes.international_collaboration_rate"

variable_anchors:
  # NOTE: total_funding_allocated is NOT the national aggregate. Each scenario
  # is grounded in one specific persona/institution (e.g. "Hanyang University"),
  # so agents legitimately estimate that institution's slice of the national
  # budget (observed ~41 billion KRW for a single university in sampled data),
  # not the national 408,080 million KRW total. Treating it as anchored to the
  # national figure would flag every reasonable per-institution estimate as a
  # contradiction. Classified as predicted; the national total is still kept
  # in fact_table (annual_budget_2022) for narrative-level contradiction
  # checks when an agent explicitly discusses the *national* program budget.
  Inputs.total_funding_allocated: {type: predicted}
  Inputs.graduate_scholarship_slots: {type: predicted}
  Inputs.postdoc_positions: {type: predicted}
  Outputs.graduate_students_supported: {type: predicted}
  Outputs.postdoc_researchers_supported: {type: predicted}
  Outputs.publications_produced: {type: predicted}
  Outputs.international_conference_presentations: {type: predicted}
  Outcomes.employment_rate: {type: predicted}
  # headcount_mislabeled (v4 sec 3.4 formal type): variable name implies a
  # percentage but the observed values (median 750, up to 17,100) are
  # headcounts. Excluded from GT comparison (X1/X4), diversity (D1/D2/DX1 --
  # all filter on var_type=="predicted", so this exclusion is automatic once
  # declared here), and G2 range checking. Reported descriptively only.
  Outcomes.graduate_employment_rate_of_bk21_participants_in_2022: {type: headcount_mislabeled}
  Outcomes.international_collaboration_rate: {type: predicted}
  Outcomes.international_research_collaboration_rate_of_bk21_participants_in_2022: {type: headcount_mislabeled}
  Outcomes.full_time_faculty_lecture_ratio: {type: predicted}
  Impact.national_st_talent_competitiveness_rank: {type: predicted}
  Impact.high_impact_publications_per_1000_researchers: {type: predicted}

