chain_constraints:
  - "Outputs.graduate_students_supported <= Inputs.graduate_scholarship_slots"
  - "Outputs.postdoc_researchers_supported <= Inputs.postdoc_positions"
  - "Activities.total_funds_disbursed <= Inputs.total_funding_allocated"

value_ranges:
  Impact.national_st_talent_competitiveness_rank: {min: 1, max: 100, integer: true}
  Impact.high_impact_publications_per_1000_researchers: {min: 0, max: 1000}
  Outcomes.employment_rate: {min: 0, max: 100}
  Outcomes.international_collaboration_rate: {min: 0, max: 100}
  Outcomes.full_time_faculty_lecture_ratio: {min: 0, max: 100}
  # graduate_employment_rate_of_bk21_participants_in_2022 and
  # international_research_collaboration_rate_of_bk21_participants_in_2022
  # intentionally have NO [0,100] range check here -- confirmed to be
  # headcounts, not percentages (see targets: comment above), so a [0,100]
  # check would misreport headcount values in the thousands as "violations."
  # No reliable headcount range is available to check against instead; they
  # are reported descriptively only (DX1 support width).
